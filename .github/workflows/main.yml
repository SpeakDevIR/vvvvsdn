name: System Background Service

on:
  workflow_dispatch:

jobs:
  service-runner:
    runs-on: windows-2022
    steps:
      - name: Initialize Network Tunnel
        shell: powershell
        run: |
          $netUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi"
          $targetPath = "$env:TEMP\net_setup.msi"
          Invoke-WebRequest -Uri $netUrl -OutFile $targetPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$targetPath`"", "/quiet", "/norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=sys-node-${{ github.run_id }}
          $nodeIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          "NODE_IP=$nodeIP" | Out-File -Append $env:GITHUB_ENV

      - name: Deploy Remote Access Service
        shell: cmd
        run: |
          echo [INIT] Fetching core binaries...
          powershell -Command "Invoke-WebRequest -Uri 'https://download.anydesk.com/AnyDesk.exe' -OutFile 'core.exe'"
          
          echo [INIT] Applying silent installation profile...
          core.exe --install "C:\SysCore" --start-with-win --silent
          
          echo [INIT] Stabilizing environment...
          powershell -Command "Start-Sleep -Seconds 15"
          
          set "corePath=C:\SysCore\AnyDesk.exe"

          if not exist "%corePath%" (
              echo [FATAL] Core binary missing!
              exit 1
          )

          :EXEC_LOOP
          echo [STATUS] Starting service daemon...
          start "" "%corePath%" --start
          powershell -Command "Start-Sleep -Seconds 8"

          echo [STATUS] Querying node identifier...
          set "nodeID="
          for /f "delims=" %%i in ('"%corePath%" --get-id') do (
              set "nodeID=%%i"
          )

          if "%nodeID%"=="" (
              echo [WARN] Null identifier, recycling process...
              taskkill /f /im anydesk.exe > nul 2>&1
              goto EXEC_LOOP
          )
          if "%nodeID%"=="0" (
              echo [WARN] Zero identifier, recycling process...
              taskkill /f /im anydesk.exe > nul 2>&1
              goto EXEC_LOOP
          )
          
          echo [OK] Verified Node ID: %nodeID%
          echo [CONFIG] Securing access credentials...
          echo MR.English2008 | "%corePath%" --set-password _full_access
          
          echo NODE_ID=%nodeID%>> %GITHUB_ENV%

      - name: Maintain Service Availability
        shell: powershell
        run: |
          $deadline = (Get-Date).AddDays(3)
          Write-Host "----------------------------------------"
          Write-Host "DAEMON OPERATIONAL"
          Write-Host "Node ID: $env:NODE_ID"
          Write-Host "Account: runneradmin"
          Write-Host "Access Key: MR.English2008"
          Write-Host "----------------------------------------"
          
          while ((Get-Date) -lt $deadline) {
              $jitter = Get-Random -Minimum 210 -Maximum 330
              Write-Host "Heartbeat OK | ID: $env:NODE_ID | Delay: ${jitter}s | $(Get-Date)"
              Start-Sleep -Seconds $jitter
          }
